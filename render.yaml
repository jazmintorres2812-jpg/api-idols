services:
  - type: web
    name: asiatic-idols-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asiatic-idols-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: asiatic-idols-db
    databaseName: idols_db
    user: idols_user
    plan: 0.5c-1g
    postgresMajorVersion: "17"
